# Coverage of the library and the executable (not of tests or fuzzers), with gcovr >= 8.
# Build with -DKAIROS_COVERAGE=ON, run ctest, then from the repository root:
#   gcovr build --html-details coverage/index.html
root = .
filter = src/
filter = include/
exclude-unreachable-branches = yes
exclude-throw-branches = yes
print-summary = yes
# diseño.md, 13.4: at least 90 % of the lines
fail-under-line = 90
