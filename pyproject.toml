[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "kairos-planner"
dynamic = ["version"]
description = "Kairos: a temporal and numeric PDDL planner (PDDL 2.1-3.1, PDDL+), in Python"
readme = "python/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Martín Rico", email = "fmrico@gmail.com" }]
requires-python = ">=3.10"
keywords = ["planning", "pddl", "ai planning", "temporal planning", "robotics", "plansys2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/PlanSys2/kairos"
Documentation = "https://github.com/PlanSys2/kairos/blob/main/python/README.md"
Issues = "https://github.com/PlanSys2/kairos/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build-wheel/{wheel_tag}"
wheel.packages = ["python/kairos"]
wheel.py-api = "cp312"
install.components = ["python"]
cmake.build-type = "Release"
sdist.exclude = ["build*", ".pixi", "fuzz", "tests/data"]

[tool.scikit-build.cmake.define]
KAIROS_BUILD_PYTHON = "ON"
KAIROS_SHARED = "OFF"
KAIROS_BUILD_TESTS = "OFF"
KAIROS_BUILD_CLI = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'VERSION\s+(?P<value>\d+\.\d+\.\d+)'

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
test-requires = "pytest"
test-command = "pytest -q {project}/python/tests"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
